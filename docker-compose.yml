version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mangacms_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://mangacms:mangacmspassword@postgres:5432/mangacms?schema=public
      - APP_SECRET=manga-cms-production-32-byte-secret-key-change-me
      - NEXTAUTH_SECRET=manga-cms-production-32-byte-secret-key-change-me
      - STORAGE_DRIVER=local
      - LOCAL_STORAGE_PATH=/app/uploads
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    volumes:
      - manga_uploads:/app/uploads
      - manga_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: mangacms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mangacms
      POSTGRES_PASSWORD: mangacmspassword
      POSTGRES_DB: mangacms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangacms -d mangacms"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  manga_uploads:
    driver: local
  manga_data:
    driver: local
  postgres_data:
    driver: local
